[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "projet-rat"
version = "0.1.0"
description = "Remote Administration Tool (RAT) - client/serveur chiffré TLS, multi-sessions."
authors = [
  "Dylan Klein <d.klein@myskolae.fr>",
  "Lelian Dupont <l.dupont@myskolae.fr>"
]
readme = "README.md"
packages = [{ include = "rat", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
cryptography = ">=43.0.0"
msgpack = ">=1.1.0"
prompt-toolkit = ">=3.0.48"
psutil = ">=6.0.0"
mss = ">=9.0.1"
pillow = ">=10.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"
types-psutil = "^6.0.0.20240901"
pre-commit = "^3.8.0"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true
show-fixes = true
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "SIM", "UP", "S", "RUF"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]